<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-ink Task Manager</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>E-ink Task Manager</h1>
        <button id="connectBtn">Connect Bluetooth</button>
      </header>
      
      <main>
        <section class="card input-section">
          <h2>Task Information</h2>
          <div class="form-group">
            <label for="taskName">Task</label>
            <input type="text" id="taskName" placeholder="What are you doing?" value="Coding">
          </div>
          
          <div class="form-group time-group">
            <label>Thời gian đích (Target Time)</label>
            <input type="datetime-local" id="targetDatetime" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; margin-bottom: 10px; color-scheme: dark;">
          </div>
          
          <div class="form-group">
            <label for="excludeHours">Trừ hao ngủ/ăn (Giờ)</label>
            <input type="number" id="excludeHours" min="0" value="9" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text);">
          </div>
          
          <div class="form-group time-group">
            <label>Thời gian còn lại (Tự động tính)</label>
            <div class="time-inputs">
              <input type="number" id="hours" min="0" value="0" readonly style="opacity: 0.6; cursor: not-allowed;">
              <span>:</span>
              <input type="number" id="minutes" min="0" max="59" value="0" readonly style="opacity: 0.6; cursor: not-allowed;">
            </div>
          </div>
          
          <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="syncBtn" disabled style="flex: 1;">Start Countdown</button>
            <button id="stopBtn" disabled style="flex: 1; background: #e74c3c;">Stop</button>
          </div>
        </section>
        
        <section class="card preview-section">
          <h2>Preview (212x104)</h2>
          <canvas id="previewCanvas" width="212" height="104"></canvas>
          <div id="status">Status: Disconnected</div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
